; 通过 run_services.sh 设置绝对路径；控制接口只开放给当前本机用户。
[unix_http_server]
file=%(ENV_AIWS_RUN_DIR)s/supervisor.sock
chmod=0600

[supervisord]
logfile=%(ENV_AIWS_RUN_DIR)s/supervisor.log
logfile_maxbytes=5MB
logfile_backups=2
pidfile=%(ENV_AIWS_RUN_DIR)s/supervisord.pid
childlogdir=%(ENV_AIWS_RUN_DIR)s
umask=0077

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(ENV_AIWS_RUN_DIR)s/supervisor.sock

; 仅全新本地部署可启用；已有 Redis 时保持 false，复用原有地址和数据目录。
[program:redis]
command=%(ENV_AIWS_REDIS_BIN)s --bind 127.0.0.1 --port %(ENV_AIWS_REDIS_PORT)s --dir %(ENV_AIWS_RUN_DIR)s/redis --appendonly yes --daemonize no
autostart=%(ENV_AIWS_MANAGE_REDIS)s
autorestart=true
startsecs=3
startretries=3
stopasgroup=true
killasgroup=true
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=%(ENV_AIWS_RUN_DIR)s/redis.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
priority=5

[program:backend]
command=/bin/bash %(ENV_AIWS_ROOT)s/backend/scripts/run_dev.sh
directory=%(ENV_AIWS_ROOT)s/backend
environment=PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=%(ENV_AIWS_RUN_DIR)s/backend.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
priority=10

[program:frontend]
command=%(ENV_AIWS_NPM)s run start -- --hostname 127.0.0.1 --port %(ENV_AIWS_FRONTEND_PORT)s
directory=%(ENV_AIWS_ROOT)s/frontend
autostart=true
autorestart=true
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=%(ENV_AIWS_RUN_DIR)s/frontend.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
priority=20

[program:knowledge-worker]
command=%(ENV_AIWS_PYTHON)s -m scripts.run_knowledge_worker
directory=%(ENV_AIWS_ROOT)s/backend
environment=PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true
stopwaitsecs=330
redirect_stderr=true
stdout_logfile=%(ENV_AIWS_RUN_DIR)s/knowledge-worker.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
priority=30

[program:memory-worker]
command=%(ENV_AIWS_PYTHON)s -m scripts.run_memory_candidate_worker
directory=%(ENV_AIWS_ROOT)s/backend
environment=PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true
stopwaitsecs=330
redirect_stderr=true
stdout_logfile=%(ENV_AIWS_RUN_DIR)s/memory-worker.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
priority=30

[program:durable-worker]
command=%(ENV_AIWS_PYTHON)s -m scripts.run_agent_tool_worker
directory=%(ENV_AIWS_ROOT)s/backend
environment=PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true
stopwaitsecs=45
redirect_stderr=true
stdout_logfile=%(ENV_AIWS_RUN_DIR)s/durable-worker.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
priority=30
