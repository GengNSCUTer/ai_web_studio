name: deterministic-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    # 固定运行镜像，避免 ubuntu-latest 在 2026-10-19 切换到 Ubuntu 26 后
    # 造成系统依赖和 PostgreSQL 服务行为出现无法预期的变化。
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_web_studio
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d ai_web_studio"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt
      - name: Create schema through the explicit migration entrypoint
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
          POSTGRES_DB: ai_web_studio
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        run: PYTHONPATH=backend python -m scripts.migrate_database upgrade
      - name: Run backend tests with PostgreSQL and Redis
        env:
          APP_ENV: test
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
          POSTGRES_DB: ai_web_studio
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          KNOWLEDGE_REDIS_URL: redis://127.0.0.1:6379/0
          TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/postgres
        run: |
          PYTHONPATH=backend python -m unittest discover -s backend/tests -p 'test_*.py'
          PYTHONPATH=backend python -m compileall -q backend/app backend/tests backend/scripts
      - name: Check migration files and shell scripts
        run: |
          set -euo pipefail
          PYTHONPATH=backend python -m scripts.migrate_database check
          while IFS= read -r script; do
            echo "Checking shell syntax: ${script}"
            bash -n "${script}"
          done < <(find deploy backend/scripts -maxdepth 1 -type f -name '*.sh' -print | sort)

  frontend:
    # 与后端保持一致，避免 latest 镜像迁移带来非代码差异。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run lint && npm run build && node --test tests/*.test.mjs

